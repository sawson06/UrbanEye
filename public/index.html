<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UrbanEye</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/css/app.css"></head><body>
<svg style="display:none"><symbol id="lm" viewBox="0 0 34 34"><rect width="34" height="34" rx="9" fill="#0d2547"/><path d="M12 28L15 7h4l3 21" fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round"/><path d="M17 11v3m0 4v3" stroke="#fff" stroke-width="2"/><circle cx="25" cy="9" r="3.2" fill="#f43f5e"/></symbol></svg>
<svg id="bgs" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"><path d="M-50 500C200 420 300 560 520 420S800 300 1100 380"/><path d="M-50 200C150 260 350 100 560 200S850 330 1100 150" style="animation-duration:12s"/><path d="M250 -50C300 200 200 400 330 650" style="animation-duration:7s"/><path d="M700 -50C650 200 780 380 700 650"/><path d="M-50 340L1100 300" style="animation-duration:15s"/></svg>

<section id="loc" class="v on"><div class="ct"><h2>Where do you want to monitor?</h2>
<div class="sb"><span id="si"></span><input id="q" placeholder="Enter city, area or location…" autocomplete="off" aria-label="Location"><button class="btn" id="ul" aria-label="Search location" title="Search location"><span id="ui"></span></button></div>
<div id="sug"></div><div id="serr" role="alert"></div><div class="chips" id="rc"></div></div></section>
<div id="zm"><div id="zmap"></div><svg class="pd" viewBox="0 0 24 24" fill="#f43f5e" stroke="#fff" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3" fill="#fff"/></svg><div class="ld"><div id="lt"></div><div class="bar"><i></i></div></div></div>
<section id="dash" class="v" data-t="d"><header><div class="lg"><svg><use href="#lm"/></svg><span>UrbanEye</span></div>
<nav><button data-t="d" class="on">Dashboard</button><button data-t="a">Analytics</button><button data-t="r">Reports</button></nav><div class="av" title="Asha Rao">A</div></header>
<main>
<section class="x td"><div class="hd"><div><h1>Road Condition Intelligence</h1><div class="loc"><span id="li"></span><span id="lc"></span></div></div></div></section>
<section class="x td"><div class="cds" id="cds"></div></section>
<section class="x td tp"><div class="wk"><div class="pn mw" id="mw"><div id="map" role="region" aria-label="Pothole map"></div>
<div class="ov gl ms" id="vt"><span id="mi"></span><input id="ms" placeholder="Search location" aria-label="Search map"></div>
<div class="ov" id="vm"><div class="gl seg" id="md"><button data-m="pin" class="on">Pins</button><button data-m="heat">Heatmap</button></div><div class="gl seg" id="st"><button data-m="map" class="on">Map</button><button data-m="sat">Satellite</button></div></div>
<div class="ov" id="vz"><button class="gl" id="zi" aria-label="Zoom in"></button><button class="gl" id="zo" aria-label="Zoom out"></button><button class="gl" id="ce" aria-label="Center on location"></button></div>
<div class="ov gl" id="vl"><span><i style="background:#4ade80"></i>Low</span><span><i style="background:#facc15"></i>Medium</span><span><i style="background:#fb923c"></i>High</span><span><i style="background:#f43f5e"></i>Critical</span></div></div>
<aside class="pn" id="dt"><div id="dc"><div class="em">Select a pothole on the map or in the list to see its AI detection details.</div></div></aside></div></section>
<section class="x td tp"><div class="pn tw"><table><thead><tr><th>ID</th><th>Location</th><th>Severity</th><th>Confidence</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div></section>
<section class="x ta"><h1 style="margin-bottom:16px">Analytics</h1><div class="an" id="an"></div></section>
<section class="x tr"><div class="pn" id="rp"></div></section>
<section class="x ts"><h1 style="margin-bottom:16px">Settings</h1><div class="pn"><label class="tgl">Start map in heatmap mode<input type="checkbox" id="sh"></label><label class="tgl">Alert me on new critical potholes<input type="checkbox" checked></label><label class="tgl">Live detection feed<input type="checkbox" checked></label></div></section>
</main></section>
<div id="tp"></div><div id="ts" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/app.js"></script></body></html>
